<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analyseur RSSI - ELRS</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>📡 Analyseur RSSI - ELRS</h1>
            <p class="subtitle">Analyse interactive des performances de liaison radio</p>
        </header>

        <main>
            <!-- Section de sélection des fichiers -->
            <section class="section">
                <h2>1️⃣ Sélection des fichiers CSV</h2>
                <div id="file-selection" class="file-grid">
                    <p class="loading">Chargement des fichiers...</p>
                </div>
                <div class="button-group">
                    <button id="select-all" class="btn btn-secondary">Tout sélectionner</button>
                    <button id="deselect-all" class="btn btn-secondary">Tout désélectionner</button>
                </div>
            </section>

            <!-- Section de sélection du type de graphique -->
            <section class="section">
                <h2>2️⃣ Type de graphique</h2>
                <div class="radio-group">
                    <label class="radio-label">
                        <input type="radio" name="graph-type" value="rssi" checked>
                        <span>📊 RSSI vs Distance</span>
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="graph-type" value="lq">
                        <span>📈 Link Quality vs Distance</span>
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="graph-type" value="grid">
                        <span>🎯 Grille de comparaison complète</span>
                    </label>
                </div>
            </section>

            <!-- Bouton d'analyse -->
            <section class="section">
                <button id="analyze-btn" class="btn btn-primary">
                    🚀 Générer l'analyse
                </button>
            </section>

            <!-- Zone d'affichage des résultats -->
            <section id="results-section" class="section hidden">
                <h2>📊 Résultats</h2>
                
                <!-- Statistiques -->
                <div id="statistics" class="statistics-grid"></div>

                <!-- Graphique -->
                <div id="plot-container" class="plot-container"></div>
            </section>

            <!-- Messages d'erreur -->
            <div id="error-message" class="error-message hidden"></div>

            <!-- Loading spinner -->
            <div id="loading" class="loading-overlay hidden">
                <div class="spinner"></div>
                <p>Analyse en cours...</p>
            </div>
        </main>

        <footer>
            <p>Analyseur RSSI - ELRS © 2024</p>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
